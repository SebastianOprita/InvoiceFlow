name: Customers CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/Services/InvoiceFlow.Customers/**'
      - 'src/BuildingBlocks/**'
      - '.github/workflows/customers-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'src/Services/InvoiceFlow.Customers/**'
      - 'src/BuildingBlocks/**'
      - '.github/workflows/customers-ci.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Customers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Restore Customers API
        run: >
          dotnet restore
          src/Services/InvoiceFlow.Customers/InvoiceFlow.Customers.Api/InvoiceFlow.Customers.Api.csproj
          
      - name: Build Customers API
        run: >
          dotnet build
          src/Services/InvoiceFlow.Customers/InvoiceFlow.Customers.Api/InvoiceFlow.Customers.Api.csproj
          --configuration Release
          --no-restore
          
      - name: Run Domain unit tests
        run: >
          dotnet test
          src/Services/InvoiceFlow.Customers/Tests/InvoiceFlow.Customers.Domain.UnitTests/InvoiceFlow.Customers.Domain.UnitTests.csproj
          --configuration Release
          --logger "trx;LogFileName=domain-tests.trx"
          --results-directory TestResults/Domain
          --collect:"XPlat Code Coverage"

      - name: Run Application unit tests
        run: >
          dotnet test
          src/Services/InvoiceFlow.Customers/Tests/InvoiceFlow.Customers.Application.UnitTests/InvoiceFlow.Customers.Application.UnitTests.csproj
          --configuration Release
          --logger "trx;LogFileName=application-tests.trx"
          --results-directory TestResults/Application
          --collect:"XPlat Code Coverage"

      - name: Run API integration tests
        run: >
          dotnet test
          src/Services/InvoiceFlow.Customers/Tests/InvoiceFlow.Customers.Api.IntegrationTests/InvoiceFlow.Customers.Api.IntegrationTests.csproj
          --configuration Release
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults/Integration
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customers-test-results
          path: TestResults/**/*.trx
      
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customers-coverage
          path: TestResults/**/coverage.cobertura.xml

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Customers Tests
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: >
          reportgenerator
          -reports:"TestResults/**/coverage.cobertura.xml"
          -targetdir:"CoverageReport"
          -reporttypes:"Html;MarkdownSummaryGithub"
          
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: customers-coverage-report
          path: CoverageReport
