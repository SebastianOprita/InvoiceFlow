name: Customers CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/Services/InvoiceFlow.Customers/**'
      - 'src/BuildingBlocks/**'
      - '.github/workflows/customers-ci.yml'

  pull_request:
    branches:
      - main
    paths:
      - 'src/Services/InvoiceFlow.Customers/**'
      - 'src/BuildingBlocks/**'
      - '.github/workflows/customers-ci.yml'

  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build and Test Customers
    runs-on: ubuntu-latest

    steps:
    
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        
      # ------------------------------------------------------------
      # .NET
      # ------------------------------------------------------------
      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      # ------------------------------------------------------------
      # SonarQube Cloud
      # ------------------------------------------------------------
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner
        
      - name: Begin SonarQube analysis
        run: >
          dotnet sonarscanner begin
          /k:"${{ vars.CUSTOMERSSONARPROJECTKEY }}"
          /o:"${{ vars.SONARORGANIZATION }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover*.xml"
          /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx"
          /d:sonar.exclusions=".github/**,global.json,Aspire/**,Docs/**,src/Services/InvoiceFlow.Identity/**,src/Services/InvoiceFlow.Invoices/**,src/Services/InvoiceFlow.Payments/**,src/Services/InvoiceFlow.Notifications/**,src/Services/InvoiceFlow.Reminder/**,**/bin/**,**/obj/**,**/Migrations/**"
          /d:sonar.coverage.exclusions="**/Migrations/**"

      # ------------------------------------------------------------
      # Restore & Build
      # ------------------------------------------------------------
      - name: Restore Customers API
        run: >
          dotnet restore
          src/Services/InvoiceFlow.Customers/InvoiceFlow.Customers.Api/InvoiceFlow.Customers.Api.csproj
          
      - name: Build Customers API
        run: >
          dotnet build
          src/Services/InvoiceFlow.Customers/InvoiceFlow.Customers.Api/InvoiceFlow.Customers.Api.csproj
          --configuration Release
          --no-restore
          
      # ------------------------------------------------------------
      # Tests
      # ------------------------------------------------------------
      - name: Run Domain unit tests
        run: >
          dotnet test
          src/Services/InvoiceFlow.Customers/Tests/InvoiceFlow.Customers.Domain.UnitTests/InvoiceFlow.Customers.Domain.UnitTests.csproj
          --configuration Release
          --results-directory TestResults/Domain
          --
          --report-trx
          --report-trx-filename domain-tests.trx
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-output-format opencover
          --coverlet-include "[InvoiceFlow.*]*"
          --coverlet-exclude-by-file "**/Migrations/*.cs"

      - name: Run Application unit tests
        run: >
          dotnet test
          src/Services/InvoiceFlow.Customers/Tests/InvoiceFlow.Customers.Application.UnitTests/InvoiceFlow.Customers.Application.UnitTests.csproj
          --configuration Release
          --results-directory TestResults/Application
          --
          --report-trx
          --report-trx-filename application-tests.trx
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-output-format opencover
          --coverlet-include "[InvoiceFlow.*]*"
          --coverlet-exclude-by-file "**/Migrations/*.cs"

      - name: Run API integration tests
        run: >
          dotnet test
          src/Services/InvoiceFlow.Customers/Tests/InvoiceFlow.Customers.Api.IntegrationTests/InvoiceFlow.Customers.Api.IntegrationTests.csproj
          --configuration Release
          --results-directory TestResults/Integration
          --
          --report-trx
          --report-trx-filename integration-tests.trx
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-output-format opencover
          --coverlet-include "[InvoiceFlow.*]*"
          --coverlet-exclude-by-file "**/Migrations/*.cs"
          
      # ------------------------------------------------------------
      # Finish SonarQube analysis
      # ------------------------------------------------------------
      - name: End SonarQube analysis
        run: >
          dotnet sonarscanner end
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      # ------------------------------------------------------------
      # Test Reporting
      # ------------------------------------------------------------

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Customers Tests
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customers-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      # ------------------------------------------------------------
      # Coverage
      # ------------------------------------------------------------

      - name: Upload raw coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customers-coverage
          path: TestResults/**/coverage.cobertura*.xml
          if-no-files-found: warn

      - name: Install ReportGenerator
        if: success()
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        if: success()
        run: >
          reportgenerator
          -reports:"TestResults/**/coverage.cobertura*.xml"
          -targetdir:"CoverageReport"
          -reporttypes:"Html;MarkdownSummaryGithub"

      - name: Publish coverage summary
        if: success()
        run: cat CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: customers-coverage-report
          path: CoverageReport
          if-no-files-found: warn
