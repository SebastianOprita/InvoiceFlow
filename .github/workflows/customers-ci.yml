name: Customers CI

on:
  workflow_call:

  push:
    branches:
      - main
    paths:
      - 'src/Services/InvoiceFlow.Customers/**'
      - 'Directory.Packages.props'
      - 'Directory.Build.props'
      - 'NuGet.config'
      - '.github/workflows/customers-ci.yml'
      - '.github/workflows/service-ci-template.yml'

  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: read
  packages: read
      
jobs:
  customers:
    uses: ./.github/workflows/service-ci-template.yml

    with:
      service_name: Customers

      service_slug: customers

      service_path: src/Services/InvoiceFlow.Customers

      api_project: src/Services/InvoiceFlow.Customers/InvoiceFlow.Customers.Api/InvoiceFlow.Customers.Api.csproj

      domain_tests: src/Services/InvoiceFlow.Customers/Tests/InvoiceFlow.Customers.Domain.UnitTests/InvoiceFlow.Customers.Domain.UnitTests.csproj

      application_tests: src/Services/InvoiceFlow.Customers/Tests/InvoiceFlow.Customers.Application.UnitTests/InvoiceFlow.Customers.Application.UnitTests.csproj

      integration_tests: src/Services/InvoiceFlow.Customers/Tests/InvoiceFlow.Customers.Api.IntegrationTests/InvoiceFlow.Customers.Api.IntegrationTests.csproj

      sonar_project_key: ${{ vars.CUSTOMERSSONARPROJECTKEY }}

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}