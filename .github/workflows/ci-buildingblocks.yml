name: BuildingBlocks CI

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read
  checks: write
  pull-requests: read
  packages: read

jobs:
  # ------------------------------------------------------------
  # Build + Test + Sonar
  # ------------------------------------------------------------
  build-and-test:
    name: Build and Test BuildingBlocks
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # .NET
      # ------------------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          source-url: https://nuget.pkg.github.com/SebastianOprita/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # NuGet Security Audit
      # ------------------------------------------------------------
      - name: Audit NuGet dependencies
        run: >
          dotnet restore
          "src/BuildingBlocks/InvoiceFlow.BuildingBlocks.slnx"
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=high
          "-warnaserror:NU1903;NU1904"

      # ------------------------------------------------------------
      # SonarQube Cloud
      # ------------------------------------------------------------
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube analysis
        run: >
          dotnet sonarscanner begin
          /k:"${{ vars.BBSONARPROJECTKEY }}"
          /o:"${{ vars.SONARORGANIZATION }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover*.xml"
          /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx"
          /d:sonar.inclusions="src/BuildingBlocks/**"
          /d:sonar.exclusions="**/bin/**,**/obj/**"
          /d:sonar.coverage.exclusions="src/BuildingBlocks/Tests/**"
          /d:sonar.qualitygate.wait=true
          /d:sonar.qualitygate.timeout=300

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build BuildingBlocks
        run: >
          dotnet build
          "src/BuildingBlocks/InvoiceFlow.BuildingBlocks.slnx"
          --configuration Release
          --no-restore

      # ------------------------------------------------------------
      # Tests
      # ------------------------------------------------------------
      - name: Run API tests
        run: >
          dotnet test
          "src/BuildingBlocks/Tests/InvoiceFlow.BuildingBlocks.Api.Tests/InvoiceFlow.BuildingBlocks.Api.Tests.csproj"
          --configuration Release
          --no-build
          --results-directory TestResults/Api
          --
          --report-trx
          --report-trx-filename api-tests.trx
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-output-format opencover
          --coverlet-include "[InvoiceFlow.BuildingBlocks.*]*"

      - name: Run Application tests
        run: >
          dotnet test
          "src/BuildingBlocks/Tests/InvoiceFlow.BuildingBlocks.Application.Tests/InvoiceFlow.BuildingBlocks.Application.Tests.csproj"
          --configuration Release
          --no-build
          --results-directory TestResults/Application
          --
          --report-trx
          --report-trx-filename application-tests.trx
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-output-format opencover
          --coverlet-include "[InvoiceFlow.BuildingBlocks.*]*"

      - name: Run Authorization tests
        run: >
          dotnet test
          "src/BuildingBlocks/Tests/InvoiceFlow.BuildingBlocks.Authorization.Tests/InvoiceFlow.BuildingBlocks.Authorization.Tests.csproj"
          --configuration Release
          --no-build
          --results-directory TestResults/Authorization
          --
          --report-trx
          --report-trx-filename authorization-tests.trx
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-output-format opencover
          --coverlet-include "[InvoiceFlow.BuildingBlocks.*]*"

      - name: Run Currency tests
        run: >
          dotnet test
          "src/BuildingBlocks/Tests/InvoiceFlow.BuildingBlocks.Currency.Tests/InvoiceFlow.BuildingBlocks.Currency.Tests.csproj"
          --configuration Release
          --no-build
          --results-directory TestResults/Currency
          --
          --report-trx
          --report-trx-filename currency-tests.trx
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-output-format opencover
          --coverlet-include "[InvoiceFlow.BuildingBlocks.*]*"

      - name: Run Domain tests
        run: >
          dotnet test
          "src/BuildingBlocks/Tests/InvoiceFlow.BuildingBlocks.Domain.Tests/InvoiceFlow.BuildingBlocks.Domain.Tests.csproj"
          --configuration Release
          --no-build
          --results-directory TestResults/Domain
          --
          --report-trx
          --report-trx-filename domain-tests.trx
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-output-format opencover
          --coverlet-include "[InvoiceFlow.BuildingBlocks.*]*"

      # ------------------------------------------------------------
      # Finish SonarQube analysis
      # ------------------------------------------------------------
      - name: End SonarQube analysis
        if: ${{ !cancelled() }}
        run: >
          dotnet sonarscanner end
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      # ------------------------------------------------------------
      # Test Reporting
      # ------------------------------------------------------------
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: BuildingBlocks Tests
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildingblocks-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      # ------------------------------------------------------------
      # Coverage
      # ------------------------------------------------------------
      - name: Upload raw coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildingblocks-coverage
          path: TestResults/**/coverage.cobertura*.xml
          if-no-files-found: warn

      - name: Install ReportGenerator
        if: success()
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        if: success()
        run: >
          reportgenerator
          -reports:"TestResults/**/coverage.cobertura*.xml"
          -targetdir:"CoverageReport"
          -reporttypes:"Html;MarkdownSummaryGithub"

      - name: Publish coverage summary
        if: success()
        run: cat CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: buildingblocks-coverage-report
          path: CoverageReport
          if-no-files-found: warn
