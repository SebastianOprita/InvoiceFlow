name: BuildingBlock Package Template

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string

      package_slug:
        required: true
        type: string

      project_path:
        required: true
        type: string

      tag_prefix:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and Publish ${{ inputs.package_name }}
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v6

      # ------------------------------------------------------------
      # .NET
      # ------------------------------------------------------------
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          source-url: https://nuget.pkg.github.com/SebastianOprita/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Package version
      # ------------------------------------------------------------
      - name: Extract package version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#${{ inputs.tag_prefix }}}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Restore + dependency audit
      # ------------------------------------------------------------
      - name: Restore and audit dependencies
        run: >
          dotnet restore
          "${{ inputs.project_path }}"
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=high
          "-warnaserror:NU1903;NU1904"
    
      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build
        run: >
          dotnet build
          "${{ inputs.project_path }}"
          --configuration Release
          --no-restore

      # ------------------------------------------------------------
      # Pack
      # ------------------------------------------------------------
      - name: Pack
        run: >
          dotnet pack
          "${{ inputs.project_path }}"
          --configuration Release
          --no-build
          --output ./artifacts/packages
          -p:PackageVersion=${{ steps.version.outputs.version }}

      # ------------------------------------------------------------
      # List package contents
      # ------------------------------------------------------------
      - name: List package contents
        run: ls -la ./artifacts/packages

      # ------------------------------------------------------------
      # Publish
      # ------------------------------------------------------------
      - name: Publish
        # Add --skip-duplicate once package versions become immutable.
        run: >
          dotnet nuget push
          "./artifacts/packages/*.nupkg"
          --source "https://nuget.pkg.github.com/SebastianOprita/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
