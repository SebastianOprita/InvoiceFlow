name: Service CI Template

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
        
      service_slug:
        required: true
        type: string

      service_path:
        required: true
        type: string

      api_project:
        required: true
        type: string

      domain_tests:
        required: true
        type: string

      application_tests:
        required: true
        type: string

      integration_tests:
        required: true
        type: string

      sonar_project_key:
        required: true
        type: string

    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read
  checks: write
  pull-requests: read
  packages: read

jobs:
  # ------------------------------------------------------------
  # Build + Test + Sonar
  # ------------------------------------------------------------
  build-and-test:
    name: Build and Test ${{ inputs.service_name }}
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # .NET
      # ------------------------------------------------------------ 
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          source-url: https://nuget.pkg.github.com/SebastianOprita/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Dependency vulnerability scanning + Restore
      # ------------------------------------------------------------
      - name: Restore and audit ${{ inputs.service_name }} dependencies
        run: >
          dotnet restore
          "${{ inputs.api_project }}"
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=high
          "-warnaserror:NU1903;NU1904"

      # ------------------------------------------------------------
      # SonarQube Cloud
      # ------------------------------------------------------------    
      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube analysis
        run: >
          dotnet sonarscanner begin
          /k:"${{ inputs.sonar_project_key }}"
          /o:"${{ vars.SONARORGANIZATION }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover*.xml"
          /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx"
          /d:sonar.inclusions="${{ inputs.service_path }}/**"
          /d:sonar.exclusions=".github/**,global.json,Directory.Packages.props,Directory.Build.props,NuGet.config,Aspire/**,Docs/**,src/BuildingBlocks/**,**/bin/**,**/obj/**,**/Migrations/**,**/Persistence/**"
          /d:sonar.coverage.exclusions="**/Migrations/**,**/Persistence/**"
          /d:sonar.cpd.exclusions="**/Entities/**/*.cs,**/ValueObjects/**/*.cs"
          /d:sonar.qualitygate.wait=true
          /d:sonar.qualitygate.timeout=300

      # ------------------------------------------------------------
      # Restore & Build
      # ------------------------------------------------------------    
      - name: Restore API
        run: dotnet restore "${{ inputs.api_project }}"

      - name: Build API
        run: >
          dotnet build
          "${{ inputs.api_project }}"
          --configuration Release
          --no-restore

      # ------------------------------------------------------------
      # Tests
      # ------------------------------------------------------------    
      - name: Run Domain unit tests
        run: >
          dotnet test
          "${{ inputs.domain_tests }}"
          --configuration Release
          --results-directory TestResults/Domain
          --
          --report-trx
          --report-trx-filename domain-tests.trx
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-output-format opencover
          --coverlet-include "[InvoiceFlow.${{ inputs.service_name }}.*]*"
          --coverlet-exclude-by-file "**/Migrations/*.cs"

      - name: Run Application unit tests
        run: >
          dotnet test
          "${{ inputs.application_tests }}"
          --configuration Release
          --results-directory TestResults/Application
          --
          --report-trx
          --report-trx-filename application-tests.trx
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-output-format opencover
          --coverlet-include "[InvoiceFlow.${{ inputs.service_name }}.*]*"
          --coverlet-exclude-by-file "**/Migrations/*.cs"

      - name: Run API integration tests
        run: >
          dotnet test
          "${{ inputs.integration_tests }}"
          --configuration Release
          --results-directory TestResults/Integration
          --
          --report-trx
          --report-trx-filename integration-tests.trx
          --coverlet
          --coverlet-output-format cobertura
          --coverlet-output-format opencover
          --coverlet-include "[InvoiceFlow.${{ inputs.service_name }}.*]*"
          --coverlet-exclude-by-file "**/Migrations/*.cs"

      # ------------------------------------------------------------
      # Finish SonarQube analysis
      # ------------------------------------------------------------    
      - name: End SonarQube analysis
        if: ${{ !cancelled() }}
        run: >
          dotnet sonarscanner end
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      # ------------------------------------------------------------
      # Test Reporting
      # ------------------------------------------------------------    
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: ${{ inputs.service_name }} Tests
          path: 'TestResults/**/*.trx'
          reporter: dotnet-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service_slug }}-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

      # ------------------------------------------------------------
      # Coverage
      # ------------------------------------------------------------
      - name: Upload raw coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service_slug }}-coverage
          path: TestResults/**/coverage.cobertura*.xml
          if-no-files-found: warn

      - name: Install ReportGenerator
        if: success()
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        if: success()
        run: >
          reportgenerator
          -reports:"TestResults/**/coverage.cobertura*.xml"
          -targetdir:"CoverageReport"
          -reporttypes:"Html;MarkdownSummaryGithub"

      - name: Publish coverage summary
        if: success()
        run: cat CoverageReport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.service_slug }}-coverage-report
          path: CoverageReport
          if-no-files-found: warn
