name: BuildingBlocks Authorization Package

on:
  push:
    tags:
      - 'buildingblocks-authorization-v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    uses: ./.github/workflows/publish-buildingblock-template.yml
    with:
      package_name: Authorization
      package_slug: authorization
      project_path: src/BuildingBlocks/InvoiceFlow.BuildingBlocks.Authorization/InvoiceFlow.BuildingBlocks.Authorization.csproj
      tag_prefix: buildingblocks-authorization-v
    secrets: inherit
